backend:
  name: github
  repo: walldrop4k-hub/walldrop-site
  branch: main
  # This site now logs into the CMS via GitHub directly, through a small
  # OAuth proxy — Cloudflare Pages has no built-in equivalent to Netlify's
  # Identity + Git Gateway, so that proxy has to be deployed separately
  # as a Cloudflare Worker (e.g. using a ready-made "decap-cms-oauth" /
  # "netlify-cms-oauth-provider-for-cloudflare-pages" template).
  #
  # TODO once that Worker is deployed:
  #   1. Set base_url below to the Worker's own URL,
  #      e.g. https://walldrop4k-cms-auth.<your-subdomain>.workers.dev
  #   2. auth_endpoint usually stays "auth" — only change it if your
  #      specific Worker template uses a different route.
  base_url: https://walldrop4k-cms-auth.walldrop4k.workers.dev
  auth_endpoint: auth

# Simple publish mode — saving an entry commits it straight to `main`
# and it goes live on the next build. (The alternative, editorial_workflow,
# adds a Draft → In Review → Ready step before publish — worth turning
# back on if more than one person starts editing the site.)
publish_mode: simple

media_folder: src/assets/wallpapers
public_folder: /assets/wallpapers

# Keep these two in sync with the "url" field in src/_data/site.json —
# that field drives the real site, this just points the CMS's own
# preview/link-back at the same place.
site_url: https://walldrop-site.pages.dev
display_url: https://walldrop-site.pages.dev
logo_url: /favicon.svg

collections:
  - name: wallpapers
    label: Wallpapers
    label_singular: Wallpaper
    folder: src/wallpapers
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}} / {{subcategory}}"
    fields:
      - { label: Title, name: title, widget: string, hint: "e.g. Amber Horizon" }
      - { label: Slug, name: slug, widget: string, hint: "Lowercase, hyphenated — kept in sync with the filename." }

      - label: Format
        name: category
        widget: select
        options:
          - { label: "Desktop (16:9)", value: desktop }
          - { label: "Mobile (9:16)", value: mobile }
        hint: "Which grid and aspect ratio this wallpaper belongs to."

      - label: Subcategory
        name: subcategory
        widget: select
        hint: "Must match a category slug from src/_data/categories.json."
        options:
          - { label: "4K (desktop)", value: "4k" }
          - { label: "Ultra HD (desktop)", value: "ultra-hd" }
          - { label: "8K (desktop)", value: "8k" }
          - { label: "Gaming (desktop)", value: "gaming" }
          - { label: "Nature (desktop)", value: "nature" }
          - { label: "Abstract (desktop)", value: "abstract" }
          - { label: "Minimal (desktop)", value: "minimal" }
          - { label: "Dark (desktop)", value: "dark" }
          - { label: "Space (desktop)", value: "space" }
          - { label: "Cars (desktop)", value: "cars" }
          - { label: "Anime (desktop)", value: "anime" }
          - { label: "City (desktop)", value: "city" }
          - { label: "iPhone (mobile)", value: "iphone" }
          - { label: "Samsung (mobile)", value: "samsung" }
          - { label: "Android (mobile)", value: "android" }
          - { label: "AMOLED (mobile)", value: "amoled" }

      - { label: "Full image (optional — upload later when you have it)", name: image, widget: image, required: false }
      - { label: "Thumbnail (optional, falls back to the full image)", name: thumbnail, widget: image, required: false }

      - label: "Placeholder color (used until you upload a real image)"
        name: gradientClass
        widget: select
        required: false
        default: grad-1
        options: [grad-1, grad-2, grad-3, grad-4, grad-5, grad-6, grad-7, grad-8]

      - label: Resolutions
        name: resolutions
        widget: list
        hint: "Most wallpapers only need one entry — the site is built for a single resolution per wallpaper."
        summary: "{{fields.label}} — {{fields.dimensions}}"
        fields:
          - { label: "Name shown on the button (e.g. Full HD, 4K, iPhone)", name: label, widget: string, hint: "This is a NAME, not pixels — e.g. \"Full HD\"." }
          - { label: "Pixel size (e.g. 1920 × 1080)", name: dimensions, widget: string, hint: "This is the actual WIDTH × HEIGHT in pixels." }

      - { label: File Size, name: fileSize, widget: string, hint: "e.g. 4.8 MB" }
      - label: Format
        name: format
        widget: select
        options: [JPG, PNG, WEBP]
        default: JPG

      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }

      - { label: Description, name: body, widget: markdown, hint: "Shown as the write-up on the wallpaper's page." }

      - { label: Date Added, name: date, widget: datetime }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Trending, name: trending, widget: boolean, default: false }

      - label: "SEO (optional — leave blank to auto-generate)"
        name: seo
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "SEO Title (overrides the page title)", name: title, widget: string, required: false }
          - { label: "Meta Description (overrides the auto-generated one)", name: description, widget: text, required: false }
          - { label: "Social Share Image (overrides the wallpaper image)", name: ogImage, widget: image, required: false }

  - name: articles
    label: Articles
    label_singular: Article
    folder: src/articles
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, hint: "Lowercase, hyphenated — kept in sync with the filename." }
      - { label: Excerpt, name: excerpt, widget: text, hint: "Shown on article cards." }

      - label: Category
        name: category
        widget: select
        options: [Guides, Trends, Tips]

      - { label: "Featured image (optional)", name: image, widget: image, required: false }
      - label: "Placeholder color (used until you upload a real image)"
        name: gradientClass
        widget: select
        required: false
        default: grad-5
        options: [grad-1, grad-2, grad-3, grad-4, grad-5, grad-6, grad-7, grad-8]

      - { label: Date, name: date, widget: datetime }
      - { label: Author, name: author, widget: string, default: "WallDrop4K Team" }
      - { label: Read Time, name: readTime, widget: string, hint: "e.g. 5 min read" }

      - { label: Body, name: body, widget: markdown }

      - label: "SEO (optional — leave blank to auto-generate)"
        name: seo
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: "SEO Title (overrides the page title)", name: title, widget: string, required: false }
          - { label: "Meta Description (overrides the excerpt)", name: description, widget: text, required: false }
          - { label: "Social Share Image (overrides the article image)", name: ogImage, widget: image, required: false }

  - name: settings
    label: Site Settings
    files:
      - name: general
        label: General
        file: src/_data/settings.json
        fields:
          - { label: Site Title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Contact Email, name: contactEmail, widget: string }
